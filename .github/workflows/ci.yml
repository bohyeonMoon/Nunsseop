name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # The sources use macOS 26 APIs behind #available, so they need the macOS 26 SDK (Xcode 26) to compile.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Build, with no warnings
        run: |
          swift build 2>&1 | tee build.log
          if grep -q "warning:" build.log; then grep "warning:" build.log | sort -u; exit 1; fi
      # Two passes that never overlap: the exhaustive sweeps (all of Unicode, thousands of glyphs) use every core of the
      # runner, and the tests that wait for a real event with a deadline time out beside them.
      - name: Test
        run: ./scripts/test.sh
      # A second run catches a test that passes only sometimes.
      - name: Test again
        run: ./scripts/test.sh

  bundle:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      # The same check a release runs: version, Apple silicon, signature, resources, and the app starting and answering.
      - name: DMG
        run: |
          dmg="$(./scripts/make-dmg.sh)"
          ./scripts/check-dmg.sh "$dmg" "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"

  site:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright
        run: npm i -g playwright && playwright install chromium-headless-shell
      - name: Site test
        run: bash scripts/site-test.sh
